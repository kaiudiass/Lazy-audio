name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-tk scrot

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      - name: Rename Output (Windows)
        if: runner.os == 'Windows'
        run: move dist\LazyAudio.exe dist\LazyAudio-Windows.exe

      - name: Rename Output (Linux)
        if: runner.os == 'Linux'
        run: mv dist/LazyAudio dist/LazyAudio-Linux

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/LazyAudio-Windows.exe
            dist/LazyAudio-Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
